<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Serif'; src: url('file://__FONTS__/dm-serif-display/files/dm-serif-display-latin-400-normal.woff2'); }
@font-face { font-family: 'Sans'; font-weight: 400; src: url('file://__FONTS__/inter/files/inter-latin-400-normal.woff2'); }
@font-face { font-family: 'Sans'; font-weight: 600; src: url('file://__FONTS__/inter/files/inter-latin-600-normal.woff2'); }
@font-face { font-family: 'Sans'; font-weight: 700; src: url('file://__FONTS__/inter/files/inter-latin-700-normal.woff2'); }
@font-face { font-family: 'Sans'; font-weight: 800; src: url('file://__FONTS__/inter/files/inter-latin-800-normal.woff2'); }
:root { __THEME_VARS__ }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: 'Sans', sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; position: relative; }
.glow { position: absolute; border-radius: 50%; pointer-events: none; }
#g1 { width: 1300px; height: 1300px; background: radial-gradient(circle, var(--glow) 0%, transparent 68%); }
#g2 { width: 1100px; height: 1100px; background: radial-gradient(circle, var(--glow2) 0%, transparent 70%); }
#brand { position: absolute; top: 190px; left: 96px; font-weight: 800; font-size: 32px; letter-spacing: 0.18em; z-index: 3; }
#brand span { color: var(--accent); }
#progress { position: absolute; top: 196px; right: 96px; display: flex; gap: 10px; z-index: 3; }
#progress i { display: block; width: 44px; height: 8px; border-radius: 6px; background: rgba(255,255,255,0.12); }
#progress i.on { background: var(--fill); }
.scene { position: absolute; left: 96px; right: 96px; top: 300px; height: 960px; display: none; flex-direction: column; z-index: 2; }
.center { justify-content: center; }
.gtext { background: var(--fill); -webkit-background-clip: text; background-clip: text; color: transparent; }
.word { display: inline-block; white-space: pre; }
/* hook */
.badge { align-self: flex-start; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 30px; letter-spacing: 0.04em; padding: 12px 26px; border-radius: 40px; margin-bottom: 44px; }
.kicker { font-weight: 800; font-size: 42px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 30px; }
.htitle { font-family: 'Serif', serif; font-size: 156px; line-height: 1.0; letter-spacing: -0.01em; }
.hsub { font-size: 58px; line-height: 1.25; margin-top: 48px; color: var(--muted); font-weight: 600; }
.hsub b { color: var(--text); font-weight: 800; }
/* rank */
.rank { font-family: 'Serif', serif; font-size: 230px; line-height: 0.92; }
.rtitle { font-family: 'Serif', serif; font-size: 104px; line-height: 1.02; margin-top: 18px; }
.money { font-weight: 800; font-size: 160px; line-height: 1; letter-spacing: -0.02em; margin-top: 52px; font-variant-numeric: tabular-nums; }
.mlabel { font-size: 36px; color: var(--muted); margin-top: 18px; font-weight: 600; }
.bar { position: relative; height: 24px; border-radius: 14px; background: rgba(255,255,255,0.09); margin-top: 46px; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 14px; background: var(--fill); }
.bar .tick { position: absolute; top: -14px; width: 5px; height: 52px; border-radius: 3px; background: var(--text); }
.reflabel { font-size: 32px; color: var(--muted); margin-top: 22px; font-weight: 600; }
.reflabel b { color: var(--text); }
.chip { align-self: flex-start; margin-top: 44px; border: 2px solid var(--accent); color: var(--text); font-weight: 700; font-size: 36px; padding: 16px 30px; border-radius: 44px; }
/* stat */
.snum { font-weight: 800; font-size: 220px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.slabel { font-family: 'Serif', serif; font-size: 84px; line-height: 1.08; margin-top: 30px; }
.snote { font-size: 42px; line-height: 1.4; color: var(--muted); margin-top: 36px; }
/* bars + text */
.heading { font-family: 'Serif', serif; font-size: 92px; line-height: 1.05; margin-bottom: 48px; }
.rows { position: relative; display: flex; flex-direction: column; gap: 34px; }
.brow .bl { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; font-size: 40px; font-weight: 600; margin-bottom: 12px; }
.brow .bl b { font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btrack { position: relative; height: 22px; border-radius: 12px; background: rgba(255,255,255,0.09); }
.btrack .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 12px; background: var(--fill); }
.refline { position: absolute; top: 60px; bottom: -14px; width: 0; border-left: 3px dashed rgba(244,246,249,0.4); }
.bref { font-size: 32px; color: var(--muted); margin-top: 40px; font-weight: 600; }
.bref b { color: var(--text); }
.tline { font-size: 52px; line-height: 1.32; margin-bottom: 30px; font-weight: 600; }
.tline .n { color: var(--accent); font-weight: 800; }
.source { font-size: 30px; line-height: 1.4; color: var(--muted); margin-top: 40px; }
/* cta */
.abar { width: 140px; height: 12px; border-radius: 8px; background: var(--fill); margin-bottom: 56px; }
.take { font-family: 'Serif', serif; font-size: 116px; line-height: 1.06; }
.follow { align-self: flex-start; margin-top: 70px; background: var(--fill); color: var(--bg); font-weight: 800; font-size: 44px; padding: 28px 46px; border-radius: 70px; }
.fsub { font-size: 38px; color: var(--muted); margin-top: 26px; font-weight: 600; }
/* captions */
#cap { position: absolute; left: 0; right: 0; top: 1330px; display: flex; justify-content: center; z-index: 5; }
#capbox { max-width: 880px; text-align: center; font-weight: 800; font-size: 60px; line-height: 1.2; padding: 18px 30px 22px; border-radius: 28px; background: rgba(7,9,15,0.74); }
#capbox .cw { display: inline-block; white-space: pre; transition: none; }
#capbox .cw.now { color: var(--accent); }
#capbox .cw.done { color: var(--text); }
#capbox .cw.todo { color: rgba(244,246,249,0.55); }
</style></head>
<body>
<div class="glow" id="g1"></div><div class="glow" id="g2"></div>
<div id="brand">HFLIC<span>.</span></div>
<div id="progress"></div>
<div id="scenes"></div>
<div id="cap"><div id="capbox"></div></div>
<script>
const R = window.REEL;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const eo = x => 1 - Math.pow(1 - clamp(x, 0, 1), 3);              // ease out cubic
const eb = x => { x = clamp(x, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }; // ease out back
const prog = (lt, a, d) => clamp((lt - a) / d, 0, 1);
const money = v => '$' + Math.round(v).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function words(text, cls) {
  return String(text).split(/(\s+)/).map(w => /^\s+$/.test(w) ? w : `<span class="word ${cls || ''}">${esc(w)}</span>`).join('');
}
function hlWords(text, hl) {
  if (!hl || !text.includes(hl)) return words(text);
  const [a, b] = text.split(hl);
  return words(a) + `<span class="word gtext">${esc(hl)}</span>` + words(b);
}
function show(el, p, dy) { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * (dy == null ? 40 : dy)}px)`; }

const B = {};  // layout builders: return {el, update(lt, sc)}
B.hook = sc => {
  const el = document.createElement('div'); el.className = 'scene center';
  el.innerHTML = (sc.badge ? `<div class="badge">${esc(sc.badge)}</div>` : '') +
    (sc.kicker ? `<div class="kicker">${esc(sc.kicker)}</div>` : '') +
    `<div class="htitle">${hlWords(sc.title, sc.highlight)}</div>` +
    (sc.sub ? `<div class="hsub">${sc.sub_html || esc(sc.sub)}</div>` : '');
  const badge = el.querySelector('.badge'), kicker = el.querySelector('.kicker'), sub = el.querySelector('.hsub');
  const ws = [...el.querySelectorAll('.htitle .word')];
  const subAt = sc.cues.sub != null ? sc.cues.sub : 1.2;
  return { el, update(lt) {
    if (badge) show(badge, eo(prog(lt, 0.0, 0.3)), 20);
    if (kicker) show(kicker, eo(prog(lt, 0.05, 0.3)), 24);
    ws.forEach((w, i) => { const p = eb(prog(lt, 0.08 + i * 0.07, 0.38)); w.style.opacity = clamp(p * 1.4, 0, 1); w.style.transform = `translateY(${(1 - p) * 70}px) scale(${0.85 + 0.15 * p})`; });
    if (sub) show(sub, eo(prog(lt, subAt - 0.1, 0.35)), 30);
  }};
};
B.rank = sc => {
  const el = document.createElement('div'); el.className = 'scene';
  const max = sc.max || sc.value * 1.15, refPct = sc.ref ? 100 * sc.ref / max : null, pct = 100 * sc.value / max;
  el.innerHTML = `<div class="rank gtext">#${sc.rank}</div><div class="rtitle">${words(sc.title)}</div>` +
    `<div class="money">$0</div><div class="mlabel">${esc(sc.label || '')}</div>` +
    `<div class="bar"><div class="fill"></div>${refPct != null ? `<div class="tick" style="left:${refPct}%"></div>` : ''}</div>` +
    (sc.ref ? `<div class="reflabel">${esc(sc.ref_label || 'Reference')}: <b>${money(sc.ref)}</b> (the white line)</div>` : '') +
    (sc.chip ? `<div class="chip">${esc(sc.chip)}</div>` : '');
  const rank = el.querySelector('.rank'), tws = [...el.querySelectorAll('.rtitle .word')], m = el.querySelector('.money'),
        ml = el.querySelector('.mlabel'), fill = el.querySelector('.bar .fill'), tick = el.querySelector('.tick'),
        rl = el.querySelector('.reflabel'), chip = el.querySelector('.chip'), bar = el.querySelector('.bar');
  const tAt = sc.cues.title != null ? sc.cues.title : 0.5, vAt = sc.cues.value != null ? sc.cues.value : 1.4;
  return { el, update(lt) {
    const pr = eb(prog(lt, 0, 0.4)); rank.style.opacity = clamp(pr * 1.5, 0, 1); rank.style.transform = `translateX(${(1 - pr) * -120}px) scale(${0.7 + 0.3 * pr})`; rank.style.transformOrigin = 'left center';
    tws.forEach((w, i) => show(w, eo(prog(lt, tAt - 0.15 + i * 0.06, 0.32)), 34));
    const pv = eo(prog(lt, vAt - 0.75, 0.95));
    m.textContent = money(sc.value * pv); show(m, eo(prog(lt, vAt - 0.8, 0.25)), 20);
    show(ml, eo(prog(lt, vAt - 0.7, 0.3)), 16); show(bar, eo(prog(lt, vAt - 0.8, 0.25)), 16);
    fill.style.width = (pct * pv) + '%';
    if (tick) tick.style.opacity = eo(prog(lt, vAt + 0.1, 0.3));
    if (rl) show(rl, eo(prog(lt, vAt + 0.15, 0.3)), 14);
    if (chip) show(chip, eb(prog(lt, (sc.cues.chip != null ? sc.cues.chip : vAt + 0.6) - 0.1, 0.35)), 30);
  }};
};
B.stat = sc => {
  const el = document.createElement('div'); el.className = 'scene center';
  el.innerHTML = (sc.kicker ? `<div class="kicker">${esc(sc.kicker)}</div>` : '') + `<div class="snum gtext">0</div>` +
    `<div class="slabel">${words(sc.label || '')}</div>` + (sc.note ? `<div class="snote">${esc(sc.note)}</div>` : '') +
    (sc.source ? `<div class="source">${esc(sc.source)}</div>` : '');
  const k = el.querySelector('.kicker'), n = el.querySelector('.snum'), ls = [...el.querySelectorAll('.slabel .word')], note = el.querySelector('.snote'), src = el.querySelector('.source');
  const vAt = sc.cues.value != null ? sc.cues.value : 1.0, fmt = v => (sc.prefix || '') + (sc.decimals ? v.toFixed(sc.decimals) : Math.round(v).toLocaleString('en-US')) + (sc.suffix || '');
  return { el, update(lt) {
    if (k) show(k, eo(prog(lt, 0, 0.3)), 24);
    const pv = eo(prog(lt, vAt - 0.8, 1.0)); n.textContent = fmt(sc.value * pv); show(n, eb(prog(lt, vAt - 0.9, 0.35)), 50);
    ls.forEach((w, i) => show(w, eo(prog(lt, vAt + 0.1 + i * 0.05, 0.3)), 30));
    if (note) show(note, eo(prog(lt, sc.cues.note != null ? sc.cues.note : vAt + 0.9, 0.35)), 24);
    if (src) show(src, eo(prog(lt, vAt + 0.5, 0.3)), 10);
  }};
};
B.bars = sc => {
  const el = document.createElement('div'); el.className = 'scene center';
  const max = sc.max || Math.max(...sc.items.map(i => i[1])) * 1.08;
  el.innerHTML = `<div class="heading">${words(sc.heading)}</div><div class="rows">` +
    sc.items.map(i => `<div class="brow"><div class="bl"><span>${esc(i[0])}</span><b>${esc(i[2])}</b></div><div class="btrack"><div class="fill" style="width:0"></div></div></div>`).join('') +
    (sc.ref ? `<div class="refline" style="left:${100 * sc.ref / max}%"></div>` : '') + `</div>` +
    (sc.ref ? `<div class="bref">Dashed line: ${esc(sc.ref_label || 'reference')}, <b>${money(sc.ref)}</b></div>` : '') +
    (sc.source ? `<div class="source">${esc(sc.source)}</div>` : '');
  const hw = [...el.querySelectorAll('.heading .word')], rows = [...el.querySelectorAll('.brow')], ref = el.querySelector('.refline'), bref = el.querySelector('.bref'), src = el.querySelector('.source');
  return { el, update(lt) {
    hw.forEach((w, i) => show(w, eo(prog(lt, i * 0.05, 0.3)), 30));
    rows.forEach((r, i) => { const a = 0.25 + i * 0.16; show(r, eo(prog(lt, a, 0.3)), 24); r.querySelector('.fill').style.width = (100 * sc.items[i][1] / max * eo(prog(lt, a + 0.05, 0.6))) + '%'; });
    const after = 0.3 + rows.length * 0.16 + 0.4;
    if (ref) ref.style.opacity = eo(prog(lt, after, 0.3));
    if (bref) show(bref, eo(prog(lt, after, 0.3)), 14);
    if (src) show(src, eo(prog(lt, after + 0.1, 0.3)), 10);
  }};
};
B.text = sc => {
  const el = document.createElement('div'); el.className = 'scene center';
  el.innerHTML = (sc.heading ? `<div class="heading">${words(sc.heading)}</div>` : '') +
    (sc.items || []).map((t, i) => `<div class="tline"><span class="n">${sc.numbered ? (i + 1) + '. ' : ''}</span>${esc(t)}</div>`).join('') +
    (sc.source ? `<div class="source">${esc(sc.source)}</div>` : '');
  const hw = [...el.querySelectorAll('.heading .word')], ls = [...el.querySelectorAll('.tline')], src = el.querySelector('.source');
  const at = sc.cues.items || ls.map((_, i) => 0.5 + i * 0.9);
  return { el, update(lt) {
    hw.forEach((w, i) => show(w, eo(prog(lt, i * 0.05, 0.3)), 30));
    ls.forEach((l, i) => show(l, eo(prog(lt, at[i] - 0.1, 0.35)), 30));
    if (src) show(src, eo(prog(lt, 0.6, 0.3)), 10);
  }};
};
B.cta = sc => {
  const el = document.createElement('div'); el.className = 'scene center';
  el.innerHTML = `<div class="abar"></div><div class="take">${words(sc.takeaway)}</div>` +
    `<div class="follow">${esc(sc.follow || ('Follow ' + R.handle))}</div>` + (sc.sub ? `<div class="fsub">${esc(sc.sub)}</div>` : '') +
    (sc.source ? `<div class="source">${esc(sc.source)}</div>` : '');
  const ab = el.querySelector('.abar'), tw = [...el.querySelectorAll('.take .word')], f = el.querySelector('.follow'), fs = el.querySelector('.fsub'), src = el.querySelector('.source');
  const fAt = sc.cues.follow != null ? sc.cues.follow : 1.0;
  return { el, update(lt) {
    ab.style.width = (140 * eo(prog(lt, 0, 0.4))) + 'px';
    tw.forEach((w, i) => show(w, eo(prog(lt, 0.05 + i * 0.05, 0.32)), 34));
    show(f, eb(prog(lt, fAt - 0.15, 0.4)), 40); if (fs) show(fs, eo(prog(lt, fAt + 0.1, 0.3)), 20);
    if (src) show(src, eo(prog(lt, fAt + 0.2, 0.3)), 10);
  }};
};

const host = document.getElementById('scenes');
const S = R.scenes.map(sc => { const b = B[sc.layout](sc); host.appendChild(b.el); return { sc, ...b }; });
const nRank = R.progress_total || 0, pg = document.getElementById('progress');
for (let i = 0; i < nRank; i++) pg.appendChild(document.createElement('i'));
const cap = document.getElementById('capbox'), g1 = document.getElementById('g1'), g2 = document.getElementById('g2');
let lastChunk = -2;

window.render = function (t, opts) {
  opts = opts || {};
  g1.style.left = (480 + 90 * Math.sin(t * 0.31)) + 'px'; g1.style.top = (-380 + 110 * Math.cos(t * 0.23)) + 'px';
  g2.style.left = (-520 + 80 * Math.cos(t * 0.27)) + 'px'; g2.style.top = (1050 + 120 * Math.sin(t * 0.19)) + 'px';
  let active = null;
  S.forEach(s => {
    const lt = t - s.sc.start, on = lt >= 0 && lt < s.sc.dur;
    s.el.style.display = on ? 'flex' : 'none';
    if (!on) return;
    active = s.sc; s.update(lt, s.sc);
    const fin = s.sc.start === 0 ? 1 : eo(prog(lt, 0, 0.14)), fout = 1 - prog(lt, s.sc.dur - 0.16, 0.16);
    s.el.style.opacity = Math.min(fin, s.sc.last ? 1 : fout);
  });
  [...pg.children].forEach((d, i) => d.className = active && active.progress != null && i < active.progress ? 'on' : '');
  pg.style.opacity = active && active.progress != null ? 1 : 0;
  // captions
  let ci = -1;
  if (!opts.noCaptions) R.chunks.forEach((c, i) => { if (t >= c.t0 - 0.06 && t < c.until) ci = i; });
  if (ci !== lastChunk) {
    cap.innerHTML = ci < 0 ? '' : R.chunks[ci].words.map(w => `<span class="cw">${esc(w.w)}</span>`).join(' ');
    lastChunk = ci;
  }
  cap.style.display = ci < 0 ? 'none' : 'block';
  if (ci >= 0) {
    const c = R.chunks[ci], spans = cap.children;
    c.words.forEach((w, i) => { spans[i].className = 'cw ' + (t >= w.t1 ? 'done' : (t >= w.t0 ? 'now' : 'todo')); });
    const p = eo(prog(t, c.t0 - 0.06, 0.12)); cap.style.transform = `scale(${0.94 + 0.06 * p})`; cap.style.opacity = p;
  }
};
window.render(0);
</script>
</body></html>
